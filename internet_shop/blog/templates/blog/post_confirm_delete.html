{% extends 'catalog/base.html' %}
{% block title %}Удаление записи{% endblock %}
{% block content %}
<div class="container mt-4">
    <h1>Удаление записи</h1>
    <p>Вы уверены, что хотите удалить "{{ object.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Интернет-магазин{% endblock %}</title>
    <!-- Bootstrap CSS (можно подключить локально или через CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Шапка сайта -->
    {% include 'catalog/menu.html' %}

    <!-- Основной контент -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2025 Интернет-магазин. Все права защищены.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% if user.is_authenticated %}
    <a href="{% url 'users:profile' %}">Профиль</a>
    <a href="{% url 'users:logout' %}">Выход</a>
{% else %}
    <a href="{% url 'users:login' %}">Вход</a>
    <a href="{% url 'users:register' %}">Регистрация</a>
{% endif %}
